services:
  - type: web
    name: raider-rides-api
    runtime: node
    plan: free
    region: ohio
    branch: main
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: raider-rides-db
          property: connectionString
      - key: REQUIRE_DATABASE
        value: "true"
      - key: AUTH_SECRET
        sync: false
