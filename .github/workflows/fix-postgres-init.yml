name: Fix PostgreSQL initialization

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-postgres-init:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix invalid PostgreSQL DO block quoting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server.js')
          s = p.read_text()
          old = "DO $ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname='users_role_check') THEN ALTER TABLE users ADD CONSTRAINT users_role_check CHECK(role IN ('rider','driver','admin')); END IF; END $;"
          new = "DO $$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname='users_role_check') THEN ALTER TABLE users ADD CONSTRAINT users_role_check CHECK(role IN ('rider','driver','admin')); END IF; END $$;"
          if old not in s:
              print('No invalid PostgreSQL DO block found; nothing to change.')
          else:
              p.write_text(s.replace(old, new))
              print('Fixed PostgreSQL DO block quoting.')
          PY

      - name: Commit fix if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Fix PostgreSQL DO block syntax"
            git push
          fi
